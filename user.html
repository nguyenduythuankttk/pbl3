<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chônlibi — Trang Khách Hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./asset/themify-icons/themify-icons.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: 'rgb(220,77,11)', gold: '#FFB800' } } }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">

<!-- HEADER -->
<header class="bg-[rgb(220,77,11)] h-12 fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6">
    <a href="./index.html" class="text-white font-bold text-base uppercase tracking-wide">🍗 Chônlibi</a>
    <div class="flex items-center gap-3">
        <span class="text-white text-sm opacity-80" id="header-name"></span>
        <button onclick="logout()" class="text-white text-xs border border-white/40 bg-white/15 px-3 py-1 rounded-full hover:bg-white/25 transition uppercase font-bold">
            <i class="ti-power-off"></i> Đăng Xuất
        </button>
    </div>
</header>

<!-- MAIN -->
<div class="mt-12 flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-52 bg-white border-r border-gray-200 pt-5 flex-shrink-0">
        <div class="px-4 pb-3 text-xs font-bold text-gray-400 uppercase tracking-widest">Khách Hàng</div>

        <a onclick="showTab('order')" id="tab-order"
           class="tab-item flex items-center gap-3 px-5 py-2.5 text-sm font-semibold text-gray-500 border-l-[3px] border-transparent cursor-pointer hover:bg-orange-50 hover:text-[rgb(220,77,11)] hover:border-[rgb(220,77,11)] transition-all">
            <i class="ti-shopping-cart w-4 text-center"></i> Đặt Hàng
        </a>
        <a onclick="showTab('my-orders')" id="tab-my-orders"
           class="tab-item flex items-center gap-3 px-5 py-2.5 text-sm font-semibold text-gray-500 border-l-[3px] border-transparent cursor-pointer hover:bg-orange-50 hover:text-[rgb(220,77,11)] hover:border-[rgb(220,77,11)] transition-all">
            <i class="ti-package w-4 text-center"></i> Đơn Của Tôi
        </a>
        <a onclick="showTab('history')" id="tab-history"
           class="tab-item flex items-center gap-3 px-5 py-2.5 text-sm font-semibold text-gray-500 border-l-[3px] border-transparent cursor-pointer hover:bg-orange-50 hover:text-[rgb(220,77,11)] hover:border-[rgb(220,77,11)] transition-all">
            <i class="ti-time w-4 text-center"></i> Lịch Sử
        </a>
    </aside>

    <!-- CONTENT -->
    <main class="flex-1 p-6">

        <!-- ĐẶT HÀNG -->
        <section id="section-order" class="hidden">
            <h1 class="text-lg font-bold mb-5">🛒 Đặt Hàng</h1>

            <!-- Menu items -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-6" id="menu-grid"></div>

            <!-- Giỏ hàng -->
            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div class="px-5 py-3 border-b border-gray-100 font-bold text-sm flex justify-between items-center">
                    <span>🛒 Giỏ hàng</span>
                    <button onclick="clearCart()" class="text-xs text-red-400 hover:text-red-600 font-semibold">Xoá tất cả</button>
                </div>
                <div id="cart-list" class="p-4 min-h-[80px]">
                    <p class="text-gray-400 text-sm text-center py-4">Chưa có món nào</p>
                </div>
                <div class="px-5 py-3 border-t border-gray-100 flex justify-between items-center">
                    <div>
                        <span class="text-sm text-gray-500">Tổng cộng:</span>
                        <span class="text-lg font-bold text-[rgb(220,77,11)] ml-2" id="cart-total">0 đ</span>
                    </div>
                    <div class="flex gap-2 items-center">
                        <input type="text" id="order-note" placeholder="Ghi chú..." class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-[rgb(220,77,11)] w-48">
                        <button onclick="placeOrder()" class="bg-[rgb(220,77,11)] hover:bg-[#c0390a] text-white font-bold text-sm px-5 py-2 rounded-lg transition">
                            Đặt Hàng
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ĐƠN CỦA TÔI -->
        <section id="section-my-orders" class="hidden">
            <h1 class="text-lg font-bold mb-5">📦 Đơn Hàng Của Tôi</h1>
            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-orange-50 text-gray-500 text-xs uppercase tracking-wide">
                                <th class="px-4 py-3 text-left font-bold">Mã đơn</th>
                                <th class="px-4 py-3 text-left font-bold">Món</th>
                                <th class="px-4 py-3 text-left font-bold">Tổng tiền</th>
                                <th class="px-4 py-3 text-left font-bold">Ghi chú</th>
                                <th class="px-4 py-3 text-left font-bold">Ngày đặt</th>
                                <th class="px-4 py-3 text-left font-bold">Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="my-orders-tbody">
                            <tr><td colspan="6" class="text-center py-10 text-gray-400">Chưa có đơn hàng nào</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- LỊCH SỬ -->
        <section id="section-history" class="hidden">
            <h1 class="text-lg font-bold mb-5">🕐 Lịch Sử Đơn Hàng</h1>
            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-orange-50 text-gray-500 text-xs uppercase tracking-wide">
                                <th class="px-4 py-3 text-left font-bold">Mã đơn</th>
                                <th class="px-4 py-3 text-left font-bold">Món</th>
                                <th class="px-4 py-3 text-left font-bold">Tổng tiền</th>
                                <th class="px-4 py-3 text-left font-bold">Ngày đặt</th>
                                <th class="px-4 py-3 text-left font-bold">Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <tr><td colspan="5" class="text-center py-10 text-gray-400">Chưa có lịch sử đơn hàng</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>
</div>

<script src="./asset/js/user.js"></script>
</body>
</html>
